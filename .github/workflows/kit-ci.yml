# daily-log-kit v1.3.2 — キット自体の検証（このワークフローは各リポジトリには配布しない）
# ・unit: Node.js の単体テストとキットの決まりの検査（Linux と Windows、Node 22 と 24）
# ・e2e-windows: Windows PowerShell 5.1 と PowerShell 7 で install-all.ps1 / publish-kit.ps1 を通しで実行
name: kit-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: node --test

  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: スクリプトの構文（Windows PowerShell 5.1）
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $e = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e) | Out-Null
            foreach ($x in $e) { Write-Host "$($_.Name): $($x.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }
      - name: 通しテスト（Windows PowerShell 5.1）
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\e2e.ps1
      - name: 通しテスト（PowerShell 7）
        shell: pwsh
        run: pwsh -NoProfile -File tests\e2e.ps1
